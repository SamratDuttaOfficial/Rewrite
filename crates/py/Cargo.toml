[package]
name = "rewrite-native"
description = "The Python module over rewrite-core, used by the Tk app until the move to Rust is done"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "rewrite_native"
crate-type = ["cdylib"]

[dependencies]
image = { version = "0.25.10", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
pythonize = "0.29"
rewrite-core = { path = "../core" }
