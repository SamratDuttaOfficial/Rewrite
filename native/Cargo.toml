[package]
name = "rewrite-native"
version = "0.1.0"
edition = "2024"
publish = false
description = "Document formats, PDF writing and layout for Rewrite"

[lib]
name = "rewrite_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
cfb = "0.15.0"
flate2 = "1.1.10"
fontdb = "0.24.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
lopdf = { version = "0.46.0", default-features = false }
pdf-writer = "0.15.0"
pulldown-cmark = { version = "0.13.5", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
pythonize = "0.29"
regex = "1.13.1"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
subsetter = "0.2.6"
ttf-parser = "0.25.1"
unicode-normalization = "0.1.26"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
